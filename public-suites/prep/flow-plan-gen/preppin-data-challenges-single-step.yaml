- description: 'Pivot survey data and do a calc'
  id: preppin-data-challenge-2023-6-1
  utterances:
  - canonical: >-
      Pivot the survey data to split up Mobile/Online. Then calculate average ratings for each platform (mobile and online). 1. Mobile App Superfans: if the difference between the average is greater than or equal to 2 in the Mobile App's favor 2. Mobile App Fans: if difference >= 1 in mobile's favor 3. Online Interface Fan: difference >= 1 in the Online's favour 4. Online Interface Superfan: greater than or equal to 2 in the Online's favour 5. Neutral if difference is <1
    expected-flow-plan:
    - PivotFieldsToRows
    - CreateCleanStep
    - CreateCalculatedField
    - CreateAggregateStep
    - PivotRowsToFields
    - CreateCalculatedField
    - CreateCalculatedField
